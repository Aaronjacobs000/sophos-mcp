"""Input for searching multiple processes in one lineage."""
input SearchLineageInput {
  """Process correlation IDs to search. You can send up to 100 IDs."""
  processCorrelationIds: [String!]!
  """Identifier of the process lineage to search."""
  lineageId: String!
  """Optional text to match in lineage records."""
  searchTerm: String
  """Optional start of the time range for counts, in Unix microseconds."""
  startTimeUsec: Int64
  """Optional end of the time range for counts, in Unix microseconds."""
  endTimeUsec: Int64
}

"""
One result for each requested process correlation ID, in input order. IDs with no matching data return zero counts. Select only needed detail fields; selecting several detail fields for many processes can increase request cost.
"""
type SearchLineageItem {
  """Correlation ID for this process."""
  processCorrelationId: String!
  """Total record counts, without applying searchTerm."""
  counts: SearchLineageCounts!
  """Record counts that match searchTerm."""
  matchingCounts: SearchLineageCounts!
  """Detailed process information for this process."""
  lineageNode(
    """Optional filters that use public field names."""
    fieldFilters: [FieldFilter!]
  ): SearchLineageNodeResult
  """Detailed detections for this process."""
  lineageNodeDetections(
    """Optional page number."""
    page: Int
    """Optional number of records per page."""
    pageSize: Int
    """How searchTerm affects returned records."""
    searchMode: SearchMode
    """Optional filters that use public field names."""
    fieldFilters: [FieldFilter!]
    """Optional sort order."""
    sortCriteria: [SortCriterion!]
    """Optional start of the time range, in Unix microseconds."""
    startTimeUsec: Int64
    """Optional end of the time range, in Unix microseconds."""
    endTimeUsec: Int64
  ): SearchLineageNodeDetectionsResult
  """Detailed key activities for this process."""
  lineageNodeKeyActivities(
    """Optional page number."""
    page: Int
    """Optional number of records per page."""
    pageSize: Int
    """How searchTerm affects returned records."""
    searchMode: SearchMode
    """Optional filters that use public field names."""
    fieldFilters: [FieldFilter!]
    """Optional sort order."""
    sortCriteria: [SortCriterion!]
    """Optional start of the time range, in Unix microseconds."""
    startTimeUsec: Int64
    """Optional end of the time range, in Unix microseconds."""
    endTimeUsec: Int64
  ): SearchLineageNodeKeyActivitiesResult
  """Detailed child processes for this process."""
  lineageNodeChildProcesses(
    """Optional page number."""
    page: Int
    """Optional number of records per page."""
    pageSize: Int
    """How searchTerm affects returned records."""
    searchMode: SearchMode
    """Optional filters that use public field names."""
    fieldFilters: [FieldFilter!]
    """Optional sort order."""
    sortCriteria: [SortCriterion!]
    """Optional start of the time range, in Unix microseconds."""
    startTimeUsec: Int64
    """Optional end of the time range, in Unix microseconds."""
    endTimeUsec: Int64
  ): SearchLineageNodeChildProcessesResult
  """Detailed related events for this process."""
  lineageNodeRelatedEvents(
    """Related event family to return."""
    eventType: RelatedEventIndexType!
    """Optional page number."""
    page: Int
    """Optional number of records per page."""
    pageSize: Int
    """How searchTerm affects returned records."""
    searchMode: SearchMode
    """Optional filters that use public field names."""
    fieldFilters: [FieldFilter!]
    """Optional sort order."""
    sortCriteria: [SortCriterion!]
    """Optional start of the time range, in Unix microseconds."""
    startTimeUsec: Int64
    """Optional end of the time range, in Unix microseconds."""
    endTimeUsec: Int64
  ): SearchLineageNodeRelatedEventsResult
}

