}

enum EnrichmentJobStatus {
  """The job is waiting to start."""
  PENDING
  """The job is running."""
  IN_PROGRESS
  """The job completed successfully."""
  COMPLETED
  """The job failed."""
  FAILED
  """At least one sub-query succeeded and at least one failed."""
  PARTIAL_SUCCESS
}

enum EnrichmentQueryType {
  """Find child processes."""
  child_process
  """Find related events."""
  related_events
  """Find detections."""
  detections
  """Find key activities."""
  key_activities
  """Find process information."""
  process_info
}

enum RelatedEventIndexType {
