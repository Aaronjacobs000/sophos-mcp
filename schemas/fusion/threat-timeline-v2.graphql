"""64-bit integer."""
scalar Int64

"""Universally unique identifier."""
scalar UUID

"""
Filter results by one field. Values for one field are combined with OR; filters are combined with AND.
"""
input FieldFilter {
  """Public field name to filter."""
  field: String!
  """Values to compare with the field."""
  values: [String!]!
  """Comparison to use. Defaults to EQUALS."""
  operator: FieldFilterOperator
}

enum FieldFilterOperator {
  """Include exact matches."""
  EQUALS
  """Exclude exact matches."""
  NOT_EQUALS
  """Include values that contain the supplied text."""
  CONTAINS
  """Include values that start with the supplied text."""
  STARTS_WITH
  """Include values greater than the supplied value."""
  GREATER_THAN
  """Include values greater than or equal to the supplied value."""
  GREATER_THAN_OR_EQUAL
  """Include values less than the supplied value."""
  LESS_THAN
  """Include values less than or equal to the supplied value."""
  LESS_THAN_OR_EQUAL
  """Include records where the field has a value."""
  EXISTS
  """Include records where the field has no value."""
  NOT_EXISTS
}

"""Sort results by one public field."""
input SortCriterion {
  """Public field name to sort by."""
  field: String!
  """Sort direction."""
  order: SortOrder!
}

enum SortOrder {
  """Sort from lowest to highest."""
  asc
  """Sort from highest to lowest."""
  desc
}

"""Choose whether text search filters records or marks matching records."""
enum SearchMode {
  """Return only records that match the search term. This is the default."""
  filter
  """Return all records and mark records that match the search term."""
  highlight
}

"""Time range covered by returned records, in Unix microseconds."""
type DataTimeRange {
  """Start of the returned time range, in Unix microseconds."""
  startTimeUsec: Int64
  """End of the returned time range, in Unix microseconds."""
  endTimeUsec: Int64
}

