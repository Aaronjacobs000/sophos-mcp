type Query {
  """Returns a process lineage as a flat list."""
  processLineageTreeSearch(
    """Process lineage search input."""
    input: LineageProcessInput!
  ): LineageProcessResult
  """
  Returns most recent related events across event families. Results are not paginated.
  """
  lineageNodeTopRelatedEvents(
    """Most recent related events input."""
    input: LineageNodeTopRelatedEventsInput!
  ): LineageNodeTopRelatedEventsResult
  """
  Returns lineage counts and selected process details for multiple processes.
  """
  searchLineage(
    """Lineage search input."""
    input: SearchLineageInput!
  ): [SearchLineageItem!]!
  """Returns enrichment status for job IDs."""
  enrichmentJobs(
    """Enrichment job IDs to check. You can send up to 100 IDs."""
    tokens: [UUID!]!
  ): [EnrichmentJob!]!
  """
  Returns status for enrichment query IDs from EnrichmentQueryEntry.queryId.
  """
  enrichmentQueries(
    """Enrichment query IDs to check. You can send up to 100 IDs."""
    queryIds: [UUID!]!
  ): [EnrichmentQueryEntry!]!
}

type Mutation {
  """Starts enrichment for one process and returns its job ID."""
  enrichNode(
    """Enrichment request input."""
    input: EnrichNodeInput!
  ): UUID!
}
