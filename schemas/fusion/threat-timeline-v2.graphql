type ProcessInfoMitreAttackInfo {
  """MITRE ATT&CK tactic."""
  tactics: String
  """MITRE ATT&CK technique name."""
  technique: String
  """MITRE ATT&CK technique identifier."""
  techniqueId: String
  """MITRE ATT&CK entry type."""
  type: String
  """Link to the MITRE ATT&CK entry."""
  url: String
}

"""Status of one enrichment query in an enrichment job."""
type EnrichmentQueryEntry {
  """Type of data requested by the enrichment query."""
  queryType: String!
  """Current enrichment status."""
  status: EnrichmentJobStatus!
  """Identifier for this enrichment query. Use it with enrichmentQueries."""
  queryId: UUID!
  """Reason the query failed. Null when it did not fail."""
