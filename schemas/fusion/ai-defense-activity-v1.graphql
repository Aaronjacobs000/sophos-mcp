  POLICY_VIOLATIONS
  "Sort by unsanctioned (shadow AI) activity count in the window."
  NOT_COVERED_COUNT
  "Sort by first observed activity timestamp with the app."
  FIRST_USED
  "Sort by most recent observed activity timestamp with the app."
  LAST_USED
}

"Sort specification for `Query.userApps` — field and direction."
input SecureAIUserAppsSortInput {
  "Field to sort by."
  field: SecureAIUserAppsSortField!
  "Sort direction. Defaults to descending."
  order: SecureAISortOrder! = DESC
}

"Filter predicates for `Query.userApps`. All fields are AND-combined."
input SecureAIUserAppsFilter {
  "Case-insensitive literal substring match against app id, name, or provider. Blank input applies no constraint."
  search: String
  "Match apps with at least one of these risk levels."
  riskLevels: [RiskLevel!]
  "When true, match only apps with at least one policy violation for this user; when false, match only apps with none. Omit for no filter."
  hasPolicyViolations: Boolean
  "When true, match only apps with at least one unsanctioned (NOT_COVERED and allowed) activity for this user; when false, match only apps with none. Omit for no filter."
  hasNotCoveredCount: Boolean
  """
  Provide absolute times or a relative preset. Default cannot live on the
  `relative` field itself because it would auto-fill when only
  startTime/endTime is provided, triggering the mutual-exclusivity error.
  """
  timeRange: SecureAITimeRange = {relative: SINCE_BEGINNING_OF_DAY}
}

"Offset/limit paginated list of one user's apps returned by `Query.userApps`."
type SecureAIUserAppsPage {
  "Entries on the current page."
  entries: [SecureAIUserApp!]!
  "Total number of apps the user used across all pages."
  totalCount: Int64!
  "Zero-based offset applied to this page after sorting."
  offset: Int64!
  "Maximum number of entries requested for this page, after server-side capping."
  limit: Int64!
  "True if more results exist after the current offset/limit window."
  hasNextPage: Boolean!
  "True if results exist before the current offset."
  hasPreviousPage: Boolean!
}

"Top-level Secure AI API queries."
type Query {
  "Fetch a single activity by ID."
  activity(id: ID!): SecureAiActivity @hasAuthzPermissionGrant(resource: "SecureAI", action: "read")
  "List activities matching the filter, sorted as requested, with cursor pagination."
  activities(filter: SecureAiActivityFilter, sort: SortInput, first: Int64 = 20, after: String, last: Int64, before: String): SecureAiActivityConnection! @hasAuthzPermissionGrant(resource: "SecureAI", action: "read")
  """
  List AI applications in the tenant inventory matching the filter, sorted
  as requested, with offset/limit pagination over the current result ordering.
  """
  appInventory(filter: SecureAIAppInventoryFilter, sort: SecureAIAppInventorySortInput, limit: Int64 = 20, offset: Int64 = 0): SecureAIAppInventoryPage! @hasAuthzPermissionGrant(resource: "SecureAI", action: "read")
  """
  List users in the tenant inventory matching the filter, sorted as requested, with
  offset/limit pagination over the current result ordering.
  """
  userInventory(filter: SecureAIUserInventoryFilter, sort: SecureAIUserInventorySortInput, limit: Int64 = 20, offset: Int64 = 0): SecureAIUserInventoryPage! @hasAuthzPermissionGrant(resource: "SecureAI", action: "read")
  """
  List the AI applications a single user interacted with in the window, sorted
  as requested, with offset/limit pagination. Identify the user
  by the public actor ID from the user inventory.
  """
  userApps(userId: ID!, filter: SecureAIUserAppsFilter, sort: SecureAIUserAppsSortInput, limit: Int64 = 20, offset: Int64 = 0): SecureAIUserAppsPage! @hasAuthzPermissionGrant(resource: "SecureAI", action: "read")
  """
  Fetch aggregate counts for AI apps and users in the requested
  inventory window.
  """
  inventorySummary(filter: SecureAIInventorySummaryFilter): SecureAIInventorySummary! @hasAuthzPermissionGrant(resource: "SecureAI", action: "read")
}

"""Tenant onboarding status. COMPLETED means onboarding is finished."""
enum SecureAITenantOnboardingStatus {
  NOT_STARTED
  IN_PROGRESS
  COMPLETED
}

"Organization-details selections captured during onboarding."
type SecureAIOrganizationDetails {
  "The user's role in the organization."
  role: String
  "User-count range bucket (e.g. 1-50, 51-200)."
  numberOfUsers: String
  "Self-reported familiarity with AI tools (none/basic/intermediate/advanced)."
  aiFamiliarity: String
  "The organization's industry/sector."
  industry: String
}

"Product-integration selections captured during onboarding — fields grow additively."
type SecureAIProductIntegration {
  "Keys of the product-integration readiness checks the user has acknowledged."
  acknowledgedCheckKeys: [String!]!
  """
  Products the user picked on the Sensor Selector onboarding step (see
  `ProductKey`). Null until the step has been captured; an empty list means
  the user visited the step without selecting anything.
  """
  selectedProductKeys: [ProductKey!]
}

"""
All onboarding selections a tenant has captured. Each field is a step's typed
selection and is null until that step captures input.
"""
type SecureAITenantOnboardingSelections {
  "Organization-details selections. Null until captured."
  organizationDetails: SecureAIOrganizationDetails
  "Product-integration selections. Null until captured."
  productIntegration: SecureAIProductIntegration
  """
  Keys of onboarding steps the user has advanced past via Continue.
  Grows monotonically during the flow; entries are pruned when a step's
  key drops from the composed flow (e.g. deselecting a sensor removes
  its setup step). Empty for tenants who haven't advanced any step yet.
  """
  passedStepKeys: [String!]!
}

"The onboarding portion of a tenant's settings: status plus captured selections."
type SecureAITenantOnboarding {
  "Onboarding status. COMPLETED means onboarding is finished."
  status: SecureAITenantOnboardingStatus!
  "Selections captured across the onboarding flow. Null until anything is captured."
  selections: SecureAITenantOnboardingSelections
}

"Audit classification derived from authentication metadata."
enum SecureAIAuditActorType {
  UNKNOWN
  INTERNAL
  EXTERNAL
}

"""
License lifecycle state for the tenant's Secure AI entitlement, independent of
onboarding progress. Set by Sophos from the tenant's license.
API calls cannot change it.
"""
enum SecureAILicenseState {
  ACTIVE
  GRACE_PERIOD
  EXPIRED
}

"""
Persisted AI Defense settings for the calling tenant. Onboarding today; extended
with new fields as more tenant settings land.
"""
type SecureAITenantSettings {
  "Onboarding portion of the tenant's settings."
  onboarding: SecureAITenantOnboarding!
  "License lifecycle state, independent of onboarding progress. Null until the license is synced for this tenant."
  licenseState: SecureAILicenseState
  "When the current grace period ends. Null when not in a grace period."
  gracePeriodEndsAt: Time
  "The underlying license's expiry date. Null if not tracked/known."
  licenseExpiryDate: Time
  "License type when known/retained by the sync source (e.g. TRIAL). Null if not tracked."
  licenseType: String
  "Identifier of the license record, when known/retained by the sync source. Null if not tracked."
  licenseId: String
  "When the license details were last fetched. Null until the first successful fetch."
  refreshedAt: Time
  """
  True when a license renewal has been detected (a genuinely different
  license than before) that is not acknowledged yet. False both when there is
  no pending renewal and when the license has never been synced for this tenant.
  """
  renewalPending: Boolean!
  "Opaque subject ID of the creator (server-set from the JWT, never input)."
  createdBy: String!
  "Audit classification of the creator, derived from auth metadata when available."
  createdByType: SecureAIAuditActorType!
  "Opaque subject ID of the last editor. Null until the first update."
  updatedBy: String
  "Audit classification of the last editor. Null until the first update."
  updatedByType: SecureAIAuditActorType
  "When the settings record was first created."
  createdAt: Time!
  "When the settings record was last updated."
  updatedAt: Time!
}

"Organization-details selections to persist."
input SecureAIOrganizationDetailsInput {
  role: String
  numberOfUsers: String
  aiFamiliarity: String
  industry: String
}

"Product-integration selections to persist."
input SecureAIProductIntegrationInput {
  acknowledgedCheckKeys: [String!]!
  "Products the user picked on the Sensor Selector onboarding step (see `ProductKey`). Omit or send null to leave unset; empty list means visited-but-no-selection."
  selectedProductKeys: [ProductKey!]
}

"Full replacement set of onboarding selections. Omit a field to leave it empty."
input SecureAITenantOnboardingSelectionsInput {
  organizationDetails: SecureAIOrganizationDetailsInput
  productIntegration: SecureAIProductIntegrationInput
  "Full replacement set of passed step keys. Omit (or send null) to leave the persisted value unchanged; send an empty list to clear."
  passedStepKeys: [String!]
}

"""
A PolicyCreateInput from the AI Defense Policy GraphQL API, as a JSON
object. It is passed to createPolicy unchanged, which validates it.
"""
scalar SecureAIPolicyDefinition

"Onboarding section of a settings update: the new status and current selections."
input SecureAITenantOnboardingInput {
  status: SecureAITenantOnboardingStatus!
  selections: SecureAITenantOnboardingSelectionsInput
  """
  Base policy to create when completing onboarding for a tenant that has none:
  a PolicyCreateInput whose kind must be TENANT_BASE. Accepted
  only with status COMPLETED and never persisted with the settings.
  
  With this set, the base policy is created with
  createPolicy before completion is recorded. When omitted, completion is
  recorded without checking for a base policy. On failure the status is not changed and
  the error carries extensions.code:
  - BASE_POLICY_REQUIRED: reserved; not returned while omitted definitions skip
    the base policy check.
  - BASE_POLICY_REJECTED: createPolicy rejected the request; the message and
    extensions.upstreamErrors ([{message, code}]) carry its errors verbatim.
  """
  basePolicy: SecureAIPolicyDefinition
}

"""
Settings to update for the calling tenant. Each section is optional so a caller
can update just the parts it owns; an omitted section is left untouched. Today
only onboarding exists.
"""
input SecureAIUpdateTenantSettingsInput {
  onboarding: SecureAITenantOnboardingInput
}

extend type Query {
  "AI Defense settings for the calling tenant. Null when the tenant has no settings record yet."
  secureAITenantSettings: SecureAITenantSettings @hasAuthzPermissionGrant(resource: "SecureAI", action: "read")
}

"Top-level Secure AI API mutations."
type Mutation {
  """
  Idempotent upsert of the calling tenant's settings: creates the record on the
  first update and updates it thereafter. The client does not need to choose
  between creating and updating. An omitted section is left untouched.
  """
  updateSecureAITenantSettings(input: SecureAIUpdateTenantSettingsInput!): SecureAITenantSettings! @hasAuthzPermissionGrant(resource: "SecureAI", action: "write")
}

"Cursor-based pagination metadata following the Relay Connections spec."
type PageInfo {
  "True if more results exist after the current page."
  hasNextPage: Boolean!
  "True if results exist before the current page."
  hasPreviousPage: Boolean!
  "Cursor of the first item in the current page, if any."
  startCursor: String
  "Cursor of the last item in the current page, if any."
  endCursor: String
}
