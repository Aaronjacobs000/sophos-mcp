  id/name, application-provider id/name, model id/name/provider, actor id/name,
  device id/name, and policy name. The search fields are OR-combined; this
  predicate remains AND-combined with every other filter field. Blank input
  applies no constraint.
  """
  search: String
  "Match against actor type."
  actorType: ActorType
  "Match against the model provider name (e.g. 'OpenAI', 'Anthropic') — the LLM-serving org."
  modelProviderName: String
  "Match against application's category list. Matches activities whose application has any of these."
  applicationCategories: [String!]
  "Match against application's compliance posture."
  applicationCompliance: [String!]
  "Match against application's training policies. Matches activities having any of the given policies."
  applicationTrainingPolicies: [String!]
  """Keep only activities where at least one sensor has one of these types."""
  sensorTypes: [SensorType!]
  "Filter by enforcement actions. Matches when an activity's action is in this list."
  actions: [Action!]
  "Filter by risk levels. Matches when an activity's risk is in this list."
  risks: [RiskLevel!]
  "Filter by public actor ids (`Actor.id`, stable or temporary fallback). Case-significant exact match."
  actorIds: [String!]
  "Filter by application identifiers (Application.id — slug). Case-significant exact match."
  applicationIds: [ID!]
  "Filter by device identifiers (`Device.id`). Case-significant exact match."
  deviceIds: [String!]
  "Filter by observed device kinds (Device.type)."
  deviceTypes: [DeviceType!]
  "Filter by observed device platforms (Device.platform)."
  devicePlatforms: [DevicePlatform!]
  "Filter by stable policy identifiers. Matches when an activity's matched policy id is in this list. Names can change and historical events may carry prior names — filter by id."
  policyIds: [ID!]
  """
  Match activities by their isUnsanctioned value. True matches allowed
  activities for AI apps not covered by a policy; false matches every other
  activity. Omit for no filter.
  """
  isUnsanctioned: Boolean
  "When true, match activities with a policy attribution; when false, match activities without a policy attribution. Omit for no filter."
  hasPolicy: Boolean
  """
  Provide absolute times or a relative preset. Default cannot live on the
  `relative` field itself because it would auto-fill when only startTime/endTime
  is provided, triggering the mutual-exclusivity error.
  """
  timeRange: SecureAITimeRange = {relative: SINCE_BEGINNING_OF_DAY}
}

