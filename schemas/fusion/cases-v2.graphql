directive @key(fields: String!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE
type Query {
  "case gets a single case."
  case(arguments: CaseArguments!): Case
  "cases returns a list of cases matching the provided arguments."
  cases(arguments: CasesArguments!): Cases!
  "caseEvidence returns the attached evidence for a case."
  caseEvidence(arguments: CaseEvidenceArguments!): CaseEvidence!
  "caseRule gets an auto-case rule"
  caseRule(arguments: CaseRuleArguments!): CaseRule
  "caseRules returns a list of case rules matching the provided arguments."
  caseRules(arguments: CaseRulesArguments!): CaseRules!
  "caseTemplate gets an auto-case template"
  caseTemplate(arguments: CaseTemplateArguments!): CaseTemplate
  "caseTemplates returns a list of case templates matching the provided arguments."
  caseTemplates(arguments: CaseTemplatesArguments!): CaseTemplates!
  "comments returns all the comments for a case"
  caseComments(arguments: CaseCommentsArguments!): CaseComments!
  "caseTypes returns the available case types for a given user and the current tenant's service level"
  caseTypes(arguments: CaseTypesArguments!): CaseTypes!
  "caseSecondaryStatuses returns the available case statuses for a given user and the current tenant's service level"
  caseSecondaryStatuses(arguments: CaseSecondaryStatusesArguments!): CaseSecondaryStatuses!
  "casePrimaryStatuses returns the available case primary statuses for a given user and the current tenant's service level"
  casePrimaryStatuses(arguments: CasePrimaryStatusesArguments!): CasePrimaryStatuses!
  "casePrimaryVerdicts returns the available case primary verdicts for a given user and the current tenant's service level"
  casePrimaryVerdicts(arguments: CasePrimaryVerdictsArguments!): CasePrimaryVerdicts!
  "caseSecondaryVerdicts returns the available case secondary verdicts for a given user and the current tenant's service level"
  caseSecondaryVerdicts(arguments: CaseSecondaryVerdictsArguments!): CaseSecondaryVerdicts!
  "caseSources returns all available case sources, optionally filtered by transition rules."
  caseSources(arguments: CaseSourcesArguments!): CaseSources!
  """
  caseFile returns file details for a single file attached to a case based on the arguments provided.
  The result will also include a pre-signed download url.
  """
  caseFile(arguments: CaseFileArguments!): CaseFile
  """
  caseFiles returns file details for all files matching the arguments provided.
  Download URLs will be generated only if the downloadURL field is requested in the query.
  Note: Audit logs are created for all file downloads except embedded files (isEmbedded=true).
  To filter by embedded status, use CQL: query with isEmbedded=true or isEmbedded=false.
  """
  caseFiles(arguments: CaseFilesArguments!): CaseFiles!
}

type Mutation {
  "createCase creates new case with the provided arguments."
  createCase(input: CreateCaseInput!): Case
  """
  updateCase updates an existing case.
  This is a PATCH style mutation, only fields that are send in the input will be updated.
  """
  updateCase(input: UpdateCaseInput!): Case
  """
  addEvidenceToCase will add more evidence to an existing case.
  Evidence added through this mutation will not be considered genesis evidence.
  The response will include the evidence that the service will attempt to add to the case.
  
  Adding evidence to cases is an asynchronous operation.
  It will typically finish pretty quickly, but added detections/events will may not show up in the returned case until the async job is fully complete.
  The processing status, that is found on the case type will reflect the state of the processing job.
  Once the status is set to 'SUCCESS' the background job is complete and requesting the case will return the related evidence.
  
  Adding, removing or updating evidence (closing a case) while other jobs are processing for a given case will cause the jobs to queue.
  Jobs will be worked through in the order they were received.
  """
  addEvidenceToCase(input: AddEvidenceToCaseInput!): AddEvidenceToCaseResult
  """
  removeEvidenceFromCase will remove evidence from an existing case.
  The response will include the evidence that the service will attempt to remove from the case.
  
  Removing evidence from cases is an asynchronous operation.
  It will typically finish pretty quickly, but removed detections/events will can remain attached to the case until the async job is fully complete.
  The processing status, that is found on the case type will reflect the state of the processing job.
  Once the status is set to 'SUCCESS' the background job is complete and requesting the case will only return evidence that was not removed.
  
  Adding, removing or updating evidence (closing a case) while other jobs are processing for a given case will cause the jobs to queue.
  Jobs will be worked through in the order they were received.
  """
  removeEvidenceFromCase(input: RemoveEvidenceFromCaseInput!): RemoveEvidenceFromCaseResult
  """
  splitCase creates one new destination case and moves the selected case evidence to it asynchronously.
  Only detections, events, saved searches, and files can be moved. Key findings, comments, entities, and agents remain on the source case.
  Requested evidence not attached to the source case (already removed, or never present) is silently ignored — only what is still attached when the move runs is moved; the rest is recorded in the audit trail as skipped. SCHEDULED attachments (upload link issued but file not yet uploaded) are likewise skipped and left on the source.
  """
  splitCase(input: SplitCaseInput!): SplitCaseResult!
  """
  mergeCase associates source evidence to a target case.
  Source cases are transitioned and may be archived.
  Evidence association is asynchronous.
  """
  mergeCase(input: MergeCaseInput!): MergeCaseResult!
  "createCaseRule accepts input to create a new auto-case rule."
  createCaseRule(input: CreateCaseRuleInput!): CaseRule
  "updateCaseRule accepts input to update an existing auto-case rule."
  updateCaseRule(input: UpdateCaseRuleInput!): CaseRule
  """
  deleteCaseRule removes an existing case rule.
  This is a hard delete. Data will not be recoverable.
  """
  deleteCaseRule(input: DeleteCaseRuleInput!): CaseRule
  "createCaseTemplate accepts input to create a new auto-case template."
  createCaseTemplate(input: CreateCaseTemplateInput!): CaseTemplate
  "updateCaseTemplate accepts input to update an existing auto-case template."
  updateCaseTemplate(input: UpdateCaseTemplateInput!): CaseTemplate
  """
  deleteCaseTemplate removes an existing case template.
  This is a hard delete. Data will not be recoverable.
  """
  deleteCaseTemplate(input: DeleteCaseTemplateInput!): CaseTemplate
  "addCaseComment adds a comment to an existing case."
  addCaseComment(input: AddCaseComment!): CaseComment
  """
  updateCaseComment updates an existing comment on a case.
  This is a PATCH style mutation, only fields that are send in the input will be updated.
  Only the user who created the comment can update it.
  Updating a comment and adding new @mentions will trigger new notifications but will not send notifications to @mentions that are already present in the comment.
  """
  updateCaseComment(input: UpdateCaseCommentInput!): CaseComment
  """
  deleteCaseComment removes an existing comment from a case.
  This is a hard delete. Data will not be recoverable.
  """
  deleteCaseComment(input: DeleteCaseCommentInput!): CaseComment
  """
  startCaseFileUpload initializes a file upload for a case.
  The response will include a pre-signed URL that can be used to upload a file to the case.
  """
  startCaseFileUpload(input: StartCaseFileUploadInput!): CaseFileUpload
  """
  deleteCaseFile removes an existing file from a case.
  This is a hard delete. Data will not be recoverable.
  """
  deleteCaseFile(input: DeleteCaseFileInput!): CaseFile
  """createCaseLink creates a new link on an existing case."""
  createCaseLink(input: CreateCaseLinkInput!): CaseLink
  """updateCaseLink updates an existing link on a case."""
  updateCaseLink(input: UpdateCaseLinkInput!): CaseLink
  """deleteCaseLink deletes an existing link from a case."""
  deleteCaseLink(input: DeleteCaseLinkInput!): CaseLink
}

"DocumentType describes the format of the key findings content."
enum DocumentType {
  MARKDOWN
  RICH_TEXT
}

"KeyFindingsDocument is a typed document envelope for key findings."
type KeyFindingsDocument {
  "The format of the content"
  documentType: DocumentType!
  "The version of the document format"
  documentVersion: String!
  """
  The content of the key findings.
  This is always a string. If the content is structured (e.g. a rich-text editor's JSON document),
  it must be serialized to a string first (e.g. JSON.stringify()).
  """
  content: String!
}

"KeyFindingsTemplate is a typed document envelope for key findings templates."
type KeyFindingsTemplate {
  "The format of the content"
  documentType: DocumentType!
  "The version of the document format"
  documentVersion: String!
  "The CEL template expression for the content"
  contentTemplate: String!
}

"CreateKeyFindingsDocumentInput describes the fields for creating key findings on a case."
input CreateKeyFindingsDocumentInput {
  "The format of the content"
  documentType: DocumentType!
  "The version of the document format"
  documentVersion: String!
  """
  The content of the key findings.
  This is always a string. If the content is structured (e.g. a rich-text editor's JSON document),
  it must be serialized to a string first (e.g. JSON.stringify()).
  """
  content: String!
}

"UpdateKeyFindingsDocumentInput describes the fields for updating key findings on a case."
input UpdateKeyFindingsDocumentInput {
  "The format of the content"
  documentType: DocumentType!
  "The version of the document format"
  documentVersion: String!
  """
  The content of the key findings.
  This is always a string. If the content is structured (e.g. a rich-text editor's JSON document),
  it must be serialized to a string first (e.g. JSON.stringify()).
  """
  content: String!
}

"CreateKeyFindingsTemplateInput describes the fields for creating key findings on a case template."
input CreateKeyFindingsTemplateInput {
  "The format of the content"
  documentType: DocumentType!
  "The version of the document format"
  documentVersion: String!
  "The CEL template expression for the content"
  contentTemplate: String!
}

"UpdateKeyFindingsTemplateInput describes the fields for updating key findings on a case template."
input UpdateKeyFindingsTemplateInput {
  "The format of the content"
  documentType: DocumentType!
  "The version of the document format"
  documentVersion: String!
  "The CEL template expression for the content"
  contentTemplate: String!
}

"CreateCaseInput Describes the fields available for creating a new case."
input CreateCaseInput {
  """
  ID of the Type the case should be opened as
  Types are restricted to the available types for the current user and tenant service level.
  """
  typeId: ID!
  """
  Severity of the case.
  2 - Informational
  4 - Low
  6 - Medium
  8 - High
  10 - Critical
  """
  severity: Int!
  """
  Title of the case.
  Max 256 characters anything over that will be trimmed.
  """
  title: String!
  "Tags used to help label the case"
  tags: [String!]
  "KeyFindings are used to explain the details of the case as a typed document envelope"
  keyFindings: CreateKeyFindingsDocumentInput
  """
  primaryStatusId is used to describe the state of the case
  Statuses are restricted to the available statuses for the current user and tenant.
  """
  primaryStatusId: ID!
  """
  secondaryStatusId is used to describe the state of the case
  Statuses are restricted to the available statuses for the current user and tenant.
  """
  secondaryStatusId: ID
  """
  secondaryStatusReason is a list of reasons associated with the secondary status.
  Each reason must be valid for the selected secondary status (see allowedSubstatusReasons on CaseSecondaryStatus).
  Not required even if the secondary status defines allowed reasons.
  """
  secondaryStatusReason: [String!]
  """
  primaryVerdictId is used to describe the state of the case when closed
  This can only be set when the case is being created in a closed state.
  """
  primaryVerdictId: ID
  """
  secondaryVerdictId is used to describe the state of the case
  This can only be set when the case is being created in a closed state and the primary verdict supports the provided verdict.
  """
  secondaryVerdictId: ID
  """
  assigneeId is used to set the user assigned to the case.
  The assignee must be a valid user, client, or @mention in the system.
  Optional. If null or empty, the case is created with no assignee.
  """
  assigneeId: String
  """
  Detections is a list of detection IDs that should be attached to the case.
  Detections added during the creation of a case are considered genesis evidence.
  """
  detectionIds: [String!]
  """
  DetectionsSearchQuery is a QUERY query that can be used to attach detections to the case.
  Only the first 50k detections will be attached to the case.
  Detections added via a search query during the case create will be considered genesis evidence.
  """
  detectionsSearchQuery: String
  """
  Events is a list of event IDs that should be attached to the case.
  Events added during the creation of a case are considered genesis evidence.
  """
  eventIds: [String!]
  """
  SearchQueries are saved searches that should be used to open the case.
  Search queries added during the creation of a case are considered genesis evidence.
  Searches added here are not executed to attach evidence, this field is only used to attached saved searches to the case.
  """
  searchQueries: [String!]
  """
  HostIds is a list of host IDs whose assets should be attached to the case on creation.
  Assets added during the creation of a case are considered genesis evidence.
  """
  hostIds: [String!]
  """
  managedBy indicates who manages the case - either the provider or the customer.
  This field is optional. If not provided, the case will be considered unclaimed unless the selected case type defines a managed by value.
  Once this field is set, it cannot be changed.
  In situations where the case type defines a managedBy, providing a value here that does not match the allowed value will return an error.
  In those situations, providing a null value here is allowed.
  """
  managedBy: CaseManagedBy
  """
  incidentAdvisorId is used to assign an Incident Advisor to cases managed by a provider.
  """
  incidentAdvisorId: ID
  """sourceId is the ID of the case source. Optional."""
  sourceId: ID
  """
  queue is the routing queue the case is being created in. Only partner / MDR provider
  users may set this field. Both subfields are independently optional.
  """
  queue: CreateCaseQueueInput
}

"""
UpdateCaseInput describes the fields available for updating a case.
Optional fields that are not provided will not be updated.
"""
input UpdateCaseInput {
  "Id of the case to update"
  id: ID!
  """
  Id of the Type the case should be updated to.
  Types are restricted to the available types for the current user and tenant service level.
  """
  typeId: ID
  """
  Severity of the case.
  2 - Informational
  4 - Low
  6 - Medium
  8 - High
  10 - Critical
  """
  severity: Int
  "Title to update the case with"
  title: String
  """
  Tags used to help label the case
  Tags are not additive, the tags provided will replace the existing tags on the case.
  If you want to keep the existing tags, you must include them in the tags field.
  Not sending the tags field at all (null) will not update the tags.
  """
  tags: [String!]
  "KeyFindings are used to explain the details of the case as a typed document envelope. Null clears, omitted means no change."
  keyFindings: UpdateKeyFindingsDocumentInput
  """
  primaryStatusId is used to describe the state of the case
  Statuses are restricted to the available statuses for the current user and tenant.
  """
  primaryStatusId: ID
  """
  secondaryStatusId is used to describe the state of the case
  Statuses are restricted to the available statuses for the current user and tenant.
  """
  secondaryStatusId: ID
  """
  secondaryStatusReason is a list of reasons associated with the secondary status.
  Each reason must be valid for the selected secondary status (see allowedSubstatusReasons on CaseSecondaryStatus).
  If the primary or secondary status changes, this field will be automatically cleared.
  """
  secondaryStatusReason: [String!]
  """
  primaryVerdictId is used to describe the state of the case when closed
  This can only be set when the case is being created in a closed state.
  """
  primaryVerdictId: ID
  """
  secondaryVerdictId is used to describe the state of the case
  This can only be set when the case is being created in a closed state and the primary verdict supports the provided verdict.
  """
  secondaryVerdictId: ID
  """
  assigneeId is used to update the user assigned to the case.
  The assignee must be a valid user, client, or @mention in the system.
  Optional. Null or omitted means no change. An empty string clears the
  current assignee. A non-empty value sets the assignee.
  Updating the assignee id and setting the status to AWAITING_ACTION will trigger a handoff if the assignee id changes, an email will be sent to the new assignee.
  """
  assigneeId: String
  """
  managedBy indicates who manages the case - either the provider or the customer.
  This field is optional. If not provided, the case will be considered unclaimed.
  Once this field is set, it cannot be changed. If the case is already managed, then providing this field will return an error.
  """
  managedBy: CaseManagedBy
  """
  incidentAdvisorId is used to assign an Incident Advisor to cases managed by a provider.
  Can be cleared by sending an empty string.
  """
  incidentAdvisorId: ID
  """
  closeReason is an optional field that can be used to provide a reason for closing the case.
  This field only has meaning when the case is being moved to a closed status and is set in the same call but it can be set at any time with any status.
  """
  closeReason: String
  """
  isArchived controls the archive status of the case.
  - Set to true to archive the case (only allowed for closed cases)
  - Set to false to unarchive the case
  - Null or omitted: no change to archive status
  """
  isArchived: Boolean
  """
  sourceId is the ID of the case source.
  If current source has empty allowedNextSources, source cannot be changed.
  Once source is set, it cannot be cleared to null.
  """
  sourceId: ID
  """
  queue is the routing queue assignment to apply to the case. Only partner / MDR
  provider users may set this field. Immutable once the case is closed.
  Omitted = no change. Subfields are independently optional within the input.
  """
  queue: UpdateCaseQueueInput
}

"AddDetectionsToCaseInput describes the fields needed to add evidence to an existing case."
input AddEvidenceToCaseInput {
  "case id to add the evidence to"
  caseId: ID!
  "Detections is a list of detection IDs that should be attached to the case"
  detectionIds: [String!]
  "DetectionsSearchQuery is a QUERY query that should be used to add detections to the case"
  detectionsSearchQuery: String
  "Events is a list of event IDs that should be attached to the case"
  eventIds: [String!]
  """
  SearchQueries are saved searches that should be attached to the case.
  Search queries added during the creation of a case are considered genesis evidence.
  Searches added here are not executed to attach evidence, this field is only used to attached saved searches to the case.
  """
  searchQueries: [String!]
  """
  HostIds is a list of host IDs whose assets should be attached to the case.
  Assets added through this mutation will not be considered genesis evidence.
  """
  hostIds: [String!]
}

"RemoveEvidenceFromCaseResult describes the fields needed to remove evidence from an existing case."
input RemoveEvidenceFromCaseInput {
  "case id"
  caseId: ID!
  "Detections is a list of detection IDs that should be removed from the case"
  detectionIds: [String!]
  "Events is a list of event IDs that should be removed from the case"
  eventIds: [String!]
  "Assets is a list of asset IDs that should be removed from the case"
  assetIds: [String!]
  "searchQueries is a list of search queries that should be removed from the case"
  searchQueries: [String!]
}

"DeleteCaseRuleInput Describes the fields available for deleting an existing case rule."
input DeleteCaseRuleInput {
  "ID of the rule to update"
  id: ID!
}

type CaseEvidence {
  "ID of the case (unique)"
  id: ID!
  "DetectionsEvidence is a list of detection evidence attached to the case"
  detectionsEvidence: [CaseDetectionEvidence!]
  "DetectionsEvidenceCount is the count of detections attached to the case"
  detectionsEvidenceCount: Int!
  "AssetsEvidence is a list of asset evidence attached to the case"
  assetsEvidence: [CaseAssetEvidence!]
  "AssetsEvidenceCount is the count of assets attached to the case"
  assetsEvidenceCount: Int!
  "EventsEvidence is a list of event evidence attached to the case"
  eventsEvidence: [CaseEventEvidence!]
  "EventsEvidenceCount is the count of events attached to the case"
  eventsEvidenceCount: Int!
  "SearchQueriesEvidence is a list of search query evidence attached to the case"
  searchQueriesEvidence: [CaseSearchQueryEvidence!]
  "SearchQueriesEvidenceCount is the count of search queries attached to the case"
  searchQueriesEvidenceCount: Int!
}

input CaseEvidenceArguments {
  "ID of the case to get evidence for"
  id: ID!
}

"Case Describes a Taegis XDR case."
type Case {
  "ID of the case (unique)"
  id: ID!
  """
  shortId is a identifier for the case that is human readable
  Short ids are not guaranteed to be created in order though they typically will be.
  """
  shortId: String!
  "Title of the case"
  title: String!
  """
  KeyFindings are used to explain the details of the case as a typed document envelope.
  NOTE: This field will not be returned in the Cases query. To get this field, you must query for the case by id using the case query.
  """
  keyFindings: KeyFindingsDocument
  """
  Severity of the case.
  2 - Informational
  4 - Low
  6 - Medium
  8 - High
  10 - Critical
  """
  severity: Int!
  "Type of the case"
  type: CaseType!
  "primary status is the current primary status of the case"
  primaryStatus: CasePrimaryStatus!
  "secondary status is the current secondary status of the case"
  secondaryStatus: CaseSecondaryStatus
  "secondaryStatusReason is a list of reasons associated with the current secondary status of the case"
  secondaryStatusReason: [String!]!
  "Tags used to help label the case"
  tags: [String!]
  "ContributorIds is a list of user ids that have contributed to the case"
  contributorIds: [String!]!
  """
  ContributorSubjects is a federated list of subjects that have contributed to the case.
  This can be used to get the user information for the contributors.
  It is not guaranteed that all contributors will be able to be resolved through federation. For example, if the federated service is down or the subject was delete.
  """
  contributorSubjects: [Subject]!
  """
  assigneeId is the id of the user, client or group assigned to the case
  It may be null to indicate that there is no assignee.
  """
  assigneeId: String
  """
  assigneeSubject is a federated field that can be used to get the user/client information for thee assignee.
  It is a convenience field that will be nil if the api does not think the field can be rendered through federation.
  It will always be nil if the assignee id is set to be an @partner mention or @customer.
  It is not guaranteed that the assignee will be able to be resolved through federation. For example, if the federated service is down or the subject was delete.
  """
  assigneeSubject: Subject
  "TenantId is the id of the tenant that the case belongs to"
  tenantId: String!
  """
  Tenant is a federated field that can be used to get the tenant information for the case.
  It is a convenience field that will be nil if the api does not think the field can be rendered through federation.
  It is not guaranteed that the tenant will be able to be resolved through federation. For example, if the federated service is down or the tenant was moved to another environment.
  """
  tenant: TenantV4
  "CreatedById is the id of the user that created the case"
  createdById: String!
  """
  CreatedBySubject is a federated field that can be used to get the user information for the creator of the case.
  It is a convenience field that will be nil if the api does not think the field can be rendered through federation.
  It is not guaranteed that the createdBy will be able to be resolved through federation. For example, if the federated service is down or the subject was delete.
  """
  createdBySubject: Subject
  """
  CreatedAt is the time the case was created
  This field will be updated if the case was originally created in a draft state and then promoted.
  """
  createdAt: Time!
  "UpdatedById is the id of the user that last updated the case"
  updatedById: String!
  """
  UpdatedBySubject is a federated field that can be used to get the user information for the last user that updated the case.
  It is a convenience field that will be nil if the api does not think the field can be rendered through federation.
  It is not guaranteed that the updatedBy will be able to be resolved through federation. For example, if the federated service is down or the subject was delete.
  """
  updatedBySubject: Subject
  "UpdatedAt is the time the case was last updated"
  updatedAt: Time!
  """
  ArchivedAt is the time the case was archived
  This field will only be set if the case is archived.
  It will be set back to nil if the case was unarchived.
  """
  archivedAt: Time
  """
  closedAt is the time the case was closed
  This field will only be set if the case has been closed.
  It will be set back to nil if the case is reopened.
  """
  closedAt: Time
  """
  closedById is the user identifier of the user who closed the case.
  This field will only be set if the case has been closed.
  It will be cleared if the case is reopened. On reopen-then-reclose,
  it reflects the most recent closer.
  """
  closedById: String
  """
  closedBySubject is a federated field that can be used to get the user information for the closer.
  This field will only be set if the case has been closed.
  It is not guaranteed that the closedById will be able to be resolved through federation. For example, if the federated service is down or the subject was deleted.
  """
  closedBySubject: Subject
  """
  The reason provided by the user when closing a case.
  This field is only populated for cases that have reached a 'Closed' status.
  """
  closeReason: String
  "riskScore is the calculated risk score of the case"
  riskScore: Float
  """
  primary verdict is the current primary verdict of the case
  Can only be set when the case is in a closed state.
  """
  primaryVerdict: CasePrimaryVerdict
  """
  secondary verdict is the current secondary verdict of the case
  Can only be set when the case is in a closed state.
  Not every primary verdict has a secondary verdict.
  """
  secondaryVerdict: CaseSecondaryVerdict
  "processingStatus contains the current status of each evidence type that could be processed for the case"
  processingStatus: CaseProcessingStatus!
  "ruleId is the id of the rule that opened the case - should be only set if the case was opened by a rule"
  ruleId: ID
  """
  source indicates the method used to generate the case.
  This field is nullable - cases are not required to have a source.
  """
  source: CaseSource
  """
  links are a list of 3rd party or other links that are related to the case.
  """
  links: [CaseLink!]!
  """
  managedBy indicates who manages the case - either the provider or the customer.
  There are times where this value may be unknown - for example if the case was created before this field was introduced.
  There may also be times where the case doesn't have a managed by yet. IE: It has not been claimed.
  """
  managedBy: CaseManagedBy
  """
  incidentAdvisorId is the ID of the Incident Advisor assigned to the case.
  """
  incidentAdvisorId: ID
  """
  incidentAdvisor resolves the incident advisor's user details locally via the users API.
  Unlike assigneeSubject, this field is not federated through the subjects subgraph.
  Returns null if the incident advisor is not set or the user lookup fails.
  """
  incidentAdvisor: IncidentAdvisor
  """
  queue is the routing queue the case is currently assigned to.
  Both fields within the queue are independently optional.
  """
  queue: CaseQueue
  """
  isCreatedByPartner is a field that denotes if the case was created by the child tenants parent tenant or not.
  """
  isCreatedByPartner: Boolean!
  """
  isCreatedByMDRProvider denotes if the case was created by the tenant's MDR provider.
  """
  isCreatedByMDRProvider: Boolean!
  """
  isCreatedByParent denotes if the case was created by a parent tenant in the org hierarchy.
  """
  isCreatedByParent: Boolean!
  """
  detectionsCount is the count of detections attached to the case.
  Requesting this field can slow down the query if there are a large number of cases being requested.
  Do not request this field in a list query unless you need it.
  """
